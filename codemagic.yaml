workflows:
  classbridge-android:
    name: ClassBridge Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
    scripts:
      - name: Install Capacitor Android tools
        script: |
          npm install
          npm install --save @capacitor/core@^7 @capacitor/android@^7
          npm install --save-dev @capacitor/cli@^7
      - name: Generate Android project
        script: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK using preinstalled Gradle
        script: |
          set -e
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "Using the Gradle version already installed on the Codemagic machine:"
          gradle --version
          gradle --no-daemon assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
